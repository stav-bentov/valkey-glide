name: Publish experimental-glide crates (manual)

# Manual-only helper: publishes crates whose version isn't already on crates.io.
# The push trigger was retired — release publishing is now driven by
# sync-and-publish-release.yml (tracks upstream release tags). Kept here for
# ad-hoc manual dry-runs / one-off publishes from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no upload)'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish changed crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          # Manual dry-run by default; uncheck the box for a real publish.
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: ./scripts/publish-experimental-crates.sh
