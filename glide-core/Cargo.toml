[package]
name = "experimental-glide-core"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Valkey GLIDE Maintainers"]
description = "Core client library for Valkey GLIDE"
repository = "https://github.com/valkey-io/valkey-glide"
keywords = ["valkey", "glide", "redis", "client"]
categories = ["database"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "glide_core"

[dependencies]
uuid = { version = "1", features = ["v4", "fast-rng"] }
bytes = "1"
futures = "^0.3"
redis = { path = "./redis-rs/redis", version = "0.25.2", package = "experimental-glide-core-rs-dependency", features = [
    "aio",
    "keep-alive",
    "tokio-comp",
    "tokio-rustls-comp",
    "connection-manager",
    "cluster",
    "cluster-async",
] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rustls-pki-types = "1.9"
telemetrylib = { path = "./telemetry", version = "0.1.0", package = "experimental-glide-telemetrylib" }
tokio = { version = "1", features = ["macros", "time"] }
logger_core = { path = "../logger_core", version = "0.1.0", package = "experimental-glide-logger-core" }
tokio-util = { version = "^0.7", features = ["rt"], optional = true }
num_cpus = { version = "^1", optional = true }
tokio-retry2 = { version = "0.6", features = ["jitter"] }
aws-config = "1"
aws-credential-types = "1"
aws-sigv4 = "1"
http = "1"
urlencoding = "2"

protobuf = { version = "3", features = [
    "bytes",
    "with-bytes",
], optional = true }
integer-encoding = { version = "4", optional = true }
thiserror = "2"
rand = { version = "0.8" }
futures-intrusive = "0.5"
directories = { version = "6", optional = true }
once_cell = "1"
sha1_smol = "1"
nanoid = "0.4"
async-trait = { version = "0.1" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
versions = "7"
strum = "0.26"       
strum_macros = "0.26"
zstd = { version = "0.13" }
lz4 = { version = "1.28" }
libc = "0.2.186"

[features]
proto = ["protobuf"]
socket-layer = [
    "proto",
    "directories",
    "integer-encoding",
    "num_cpus",
    "tokio-util",
]
standalone_heartbeat = []
iam_tests = []
mock-pubsub = []
test-util = []

[dev-dependencies]
rsevents = "0.3.1"
socket2 = "0.6"
tempfile = "3.3.0"
rstest = "^0.26"
serial_test = "3"
criterion = { version = "^0.8", features = ["html_reports", "async_tokio"] }
which = "8"
ctor = "0.10"
redis = { path = "./redis-rs/redis", package = "experimental-glide-core-rs-dependency", features = ["tls-rustls-insecure"] }
rustls = { version = "0.23", features = ["aws-lc-rs"]}
gungraun = "0.19"
tokio = { version = "1", features = ["rt-multi-thread"] }
glide-core = { path = ".", package = "experimental-glide-core", features = [
    "socket-layer",
    "test-util",
] } # always enable this feature in tests.

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(standalone_heartbeat)', 'cfg(feature, values("iam_tests", "test-util"))'] }

[lints.clippy]
# Prevent blocking the async runtime
await_holding_lock = "deny"
# Additional async safety lints
mutex_atomic = "warn"

[build-dependencies]
protobuf-codegen = "3"

[[bench]]
name = "rotating_buffer_benchmark"
harness = false

[[bench]]
name = "connections_benchmark"
harness = false

[[bench]]
name = "memory_benchmark"
harness = false

[[bench]]
name = "watchdog_register_bench"
harness = false
